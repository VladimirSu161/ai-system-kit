<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════
     ДЕМО-ПРИМЕР темы dark-amber v2 для показа автору (не рабочее
     видео, вне inbox-пайплайна). 2 сцены, 10с, БЕЗ звука/аватара.
     Рендер: npx --yes hyperframes@0.7.26 render -c templates/dark-amber-example.html
     ══════════════════════════════════════════════════════════════ -->
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="shared/dark-amber.css">
<script src="shared/helpers.js"></script>
<style>
/* сценоспецифичное — только позиция прогресс-бара S2 */
#s2-bar-wrap { width: 100%; margin-top: 28px; }
</style>
</head>
<body>
<div id="root" class="clip"
     data-composition-id="root"
     data-width="1080" data-height="1920"
     data-start="0" data-duration="13">

  <!-- ═══ S1: HOOK — заголовок h1 + pill + rb-chip, scramble на "КЛОД" ═══ -->
  <div id="s1" class="scene clip" data-start="0" data-duration="5.1" data-track-index="1">
    <div class="scene-inner">
      <div id="s1-pill" class="pill" style="opacity:0;">
        <span class="pill-dot" style="background:var(--accent-blue);box-shadow:0 0 12px var(--accent-blue);"></span>
        АВТОМАТИЗАЦИЯ
      </div>
      <div class="h1">
        <span id="s1-l1" style="opacity:0; display:block;"><span id="s1-word">КЛОД</span> СОБИРАЕТ</span>
        <span id="s1-l2" style="opacity:0; display:block; color:var(--accent-blue); text-shadow:0 0 60px rgba(91,139,255,0.5);">ВИДЕО ЗА ТЕБЯ</span>
      </div>
      <div id="s1-stat" style="opacity:0; margin-top:40px; font:700 36px/1 'JetBrains Mono',monospace; color:var(--muted); letter-spacing:0.04em;">
        ЭКОНОМИЯ ВРЕМЕНИ · <span id="s1-count" style="color:var(--accent-blue); font-variant-numeric:tabular-nums;">0</span>%
      </div>
    </div>
    <div id="s1-rb" class="rb-chip rb-blue" style="opacity:0;">GSAP + HTML</div>
  </div>

  <!-- ═══ S2: Pattern B — headline + 3 карточки со стаггером, прогресс-бар ═══ -->
  <div id="s2" class="scene clip" data-start="4.6" data-duration="5.6" data-track-index="2">
    <div class="scene-inner">
      <div id="s2-pill" class="pill" style="opacity:0;">
        <span class="pill-dot" style="background:var(--accent-amber);box-shadow:0 0 12px var(--accent-amber);"></span>
        АВТОМАТИЗАЦИЯ
      </div>
      <div id="s2-h2" class="h2" style="opacity:0; margin-bottom:36px;">КАК СОБИРАЕТСЯ<br>РОЛИК ЗА 3 ШАГА</div>

      <div id="s2-card1" class="card" style="opacity:0;">
        <div class="card-icon">🎙</div>
        <div>
          <div class="card-title">Транскрипт</div>
          <div class="card-sub">WHISPER, ЛОКАЛЬНО</div>
        </div>
      </div>
      <div id="s2-card2" class="card" style="opacity:0;">
        <div class="card-icon">🎬</div>
        <div>
          <div class="card-title">Раскадровка</div>
          <div class="card-sub">GSAP TIMELINE</div>
        </div>
      </div>
      <div id="s2-card3" class="card" style="opacity:0;">
        <div class="card-icon">⚡</div>
        <div>
          <div class="card-title">Рендер</div>
          <div class="card-sub">MP4 ЗА МИНУТЫ</div>
        </div>
      </div>

      <div id="s2-bar-wrap" style="opacity:0;">
        <div class="mono-label">СБОРКА · <span id="s2-pct">0</span>%</div>
        <div class="fill-bar-track"><div id="s2-fill" class="fill-bar-fill" style="background:var(--accent-amber);"></div></div>
      </div>
    </div>
    <div id="s2-rb" class="rb-chip rb-amber" style="opacity:0;">10 СЕК ДЕМО</div>
  </div>

  <!-- ═══ S3: CTA — скрин канала + кнопка с курсором-кликом ═══ -->
  <div id="s3" class="scene clip" data-start="9.5" data-duration="3.5" data-track-index="3">
    <div class="scene-inner centered" style="top:200px;">
      <div id="s3-card" class="cta-card" style="opacity:0; width:720px;">
        <div style="display:flex; align-items:center; gap:26px; margin-bottom:32px;">
          <div class="tg-squircle" id="s3-icon">
            <svg width="56" height="56" viewBox="0 0 240 240" fill="none">
              <path d="M120 0C53.7 0 0 53.7 0 120s53.7 120 120 120 120-53.7 120-120S186.3 0 120 0zm59.2 81.8l-20.2 95.2c-1.5 6.7-5.4 8.3-10.9 5.2l-30-22.1-14.5 13.9c-1.6 1.6-2.9 2.9-6 2.9l2.1-30.3 55.2-49.9c2.4-2.1-.5-3.3-3.7-1.2l-68.2 42.9-29.4-9.2c-6.4-2-6.5-6.4 1.3-9.5l114.8-44.3c5.3-2 10 1.3 9.5 6.4z" fill="#26A5E4"/>
            </svg>
          </div>
          <div style="text-align:left;">
            <div id="s3-handle" style="opacity:0; white-space:nowrap; font-size:40px; font-weight:900; color:var(--accent-orange); line-height:1;">@ваш_канал · Telegram</div>
            <div id="s3-desc" style="opacity:0; font-size:26px; color:var(--muted); margin-top:10px; font-family:'JetBrains Mono',monospace; letter-spacing:0.04em; text-transform:uppercase;">AI-инструменты, скиллы и автоматизации</div>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:30px;">
          <div id="s3-shot" class="tg-shot" style="opacity:0;">
            <img src="assets/cta/tg-channel.jpg">
          </div>
          <div id="s3-btn" class="tg-btn" style="opacity:0;">Подписаться</div>
        </div>
      </div>
      <svg id="s3-cursor" class="tg-cursor" viewBox="0 0 24 30" style="opacity:0; left:600px; top:730px;">
        <path d="M4 2 L4 24 L10 19 L14 28 L18 26 L14 17 L21 16 Z"/>
      </svg>
    </div>
  </div>

  <!-- Караоке-субтитры: окно = весь ролик -->
  <div id="cap-band" class="clip" data-start="0" data-duration="13" data-track-index="20"></div>

</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const { fadeIn, slideUp, pop, counter, fillBar,
          zoomPunch, wipeUp, buildCaptions } = createHFHelpers(tl);

  /* ── S1: hook ── */
  fadeIn("#s1-pill", 0.1, 0.4);
  slideUp("#s1-l1",  0.3);
  fadeIn("#s1-l2",   0.75, 0.3);
  fadeIn("#s1-stat", 1.2, 0.3);
  counter("#s1-count", 0, 92, 1.1, 1.3, "");
  fadeIn("#s1-rb",   1.9, 0.4);

  /* ── переход S1 → S2: удар из мелкого (акцент на важной цифре) ──
     окна сцен перекрыты на D=0.5 (S1 duration=5.1, S2 start=4.6) */
  zoomPunch("#s1", "#s2", 4.6, 0.5);

  /* ── S2: 3 шага сборки ── */
  fadeIn("#s2-pill", 4.9, 0.35);
  fadeIn("#s2-h2",   5.1, 0.35);
  slideUp("#s2-card1", 5.35);
  slideUp("#s2-card2", 5.5);
  slideUp("#s2-card3", 5.65);
  fadeIn("#s2-bar-wrap", 5.95, 0.3);
  fillBar("#s2-fill", 6.0, 1.5, 1);
  counter("#s2-pct", 0, 100, 1.5, 6.0, "");
  fadeIn("#s2-rb", 6.2, 0.35);

  /* ── переход S2 → S3: wipeUp (к выводу/CTA), окна перекрыты на 0.6 ── */
  wipeUp("#s2", "#s3", 9.5, 0.6);

  /* ── S3: CTA — карточка, скрин, кнопка, курсор-клик ── */
  /* ТЕМП ×2 — CTA без озвучки (правило в CLAUDE.md): биты вдвое ближе,
     хвост после glow ≤2с. Это эталон для копирования в новые ролики. */
  pop("#s3-card", 9.63);
  slideUp("#s3-handle", 9.80);
  fadeIn("#s3-desc", 9.95, 0.2);
  pop("#s3-shot", 10.10);
  pop("#s3-btn", 10.35);
  /* курсор подъезжает к кнопке и «кликает» */
  tl.fromTo("#s3-cursor", {opacity:0, x:170, y:150},
    {opacity:1, x:0, y:0, duration:0.35, ease:"power2.out", immediateRender:false}, 10.50);
  tl.to("#s3-cursor", {scale:0.85, duration:0.08, ease:"power1.in"}, 10.90);
  tl.to("#s3-btn",    {scale:0.93, duration:0.08, ease:"power1.in"}, 10.90);
  tl.to("#s3-cursor", {scale:1, duration:0.11, ease:"back.out(2)"}, 10.98);
  tl.to("#s3-btn",    {scale:1, duration:0.11, ease:"back.out(2)"}, 10.98);
  tl.to("#s3-btn", {boxShadow:"0 0 60px rgba(38,165,228,0.8)", duration:0.18, yoyo:true, repeat:1}, 11.05);

  /* ── Караоке-субтитры (5–8 слов, mark + red, стиль dark-amber) ── */
  const CAP = [
    {text:"Клод",     start:0.4, end:0.9},
    {text:"собирает", start:0.95, end:1.5},
    {text:"видео",    start:1.55, end:2.0},
    {text:"сам",      start:2.05, end:2.4, hl:"mark"},
    {text:"без",      start:5.2, end:5.4, hl:"red"},
    {text:"твоего",   start:5.45, end:5.85},
    {text:"участия",  start:5.9, end:6.4},
    {text:"почти",    start:6.5, end:6.8},
    {text:"залетай",  start:10.4, end:10.9, hl:"mark"},
    {text:"в",        start:10.95, end:11.05},
    {text:"телегу",   start:11.1, end:11.6},
  ];
  buildCaptions(CAP, { markBg:"#F5B544", markColor:"#141414", redColor:"#FF5C5C" });

  window.__timelines["root"] = tl;
})();
</script>
</body>
</html>
