<!doctype html>
<!--
  БЛОК-ШАБЛОН: BG Particles 3D  (Ярус 3 словаря движения)
  =======================================================
  Поле частиц (~200), медленно дрейфующих в глубину. Прозрачный фон —
  ложится ПОЗАДИ текста в тёмной композиции. Тема dark-amber.

  ⚠ КАК ПОДКЛЮЧАТЬ (важно — иначе пустой рендер):
  Это НЕ под-композиция через data-composition-src. Компилятор HyperFrames
  склеивает inline-скрипты в один бандл, и ESM `import` его ломает. Поэтому
  3D встраивается ИНЛАЙН прямо в композицию:
    1. Скопируй <canvas id="three-layer"> в #root (z-index ниже текста).
    2. Скопируй CSS #three-layer в <style> композиции.
    3. Подключи глобальный THREE классическим тегом в <head>:
       <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    4. Скопируй классический <script> ниже в композицию.
  Несколько 3D-слоёв на странице — используй разные id канваса.

  КОНТРАКТ: всё движение — функция от time (секунды) из события hf-seek;
  без Math.random/Date.now/requestAnimationFrame; позиции из mulberry32(seed).
-->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
<canvas id="three-layer"></canvas>
<script>
(function () {
  // Детерминированный ГПСЧ (вместо Math.random)
  function mulberry32(seed){return function(){seed|=0;seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  const rand = mulberry32(12345);

  const COUNT = 200;
  // Палитра dark-amber: амбер/оранж преобладают, синий/зелёный — акценты
  const PALETTE = [0xF5B544,0xF5B544,0xE8742C,0xE8742C,0xF5B544,0xE8742C,0x5B8BFF,0x3DD68C];

  const canvas = document.getElementById("three-layer");
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(1080, 1920, false);
  renderer.setPixelRatio(1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1080 / 1920, 0.1, 100);
  camera.position.set(0, 0, 6);

  const positions = new Float32Array(COUNT * 3);
  const colors    = new Float32Array(COUNT * 3);
  const baseZ     = new Float32Array(COUNT);
  const c = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const x = (rand() - 0.5) * 8;    // ширина поля
    const y = (rand() - 0.5) * 14;   // высота поля
    const z = (rand() - 0.5) * 10;   // глубина поля
    positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z; baseZ[i] = z;
    c.setHex(PALETTE[Math.floor(rand() * PALETTE.length)]);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color",    new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.07, vertexColors: true, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);

  // Дрейф частиц к камере по Z с зацикливанием
  const Z_MIN = -8, Z_MAX = 4, Z_RANGE = Z_MAX - Z_MIN, DRIFT = 0.4;

  function renderAt(time) {
    const t = time;
    points.rotation.y = t * 0.04;                 // медленный yaw
    points.rotation.x = Math.sin(t * 0.03) * 0.08; // лёгкий pitch
    const pa = geo.attributes.position;
    for (let i = 0; i < COUNT; i++) {
      const phase = (baseZ[i] - Z_MIN) / Z_RANGE;
      const zOff  = (t * DRIFT + phase * Z_RANGE) % Z_RANGE;
      pa.array[i*3+2] = Z_MIN + zOff;
    }
    pa.needsUpdate = true;
    camera.position.x = Math.sin(t * 0.07) * 0.25; // ленивое покачивание камеры
    camera.position.y = Math.cos(t * 0.05) * 0.15;
    renderer.render(scene, camera);
  }

  window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
  renderAt(window.__hfThreeTime || 0);  // стартовый кадр
})();
</script>
</body>
</html>
