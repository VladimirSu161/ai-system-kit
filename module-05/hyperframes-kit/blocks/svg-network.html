<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════
     БЛОК: SVG-сеть узлов (Ярус 2 — SVG-момент).
     Эталон из видео 83 (сцена «Оберни в оркестрацию»).
     Заменяет Lottie: движок (проверено на 0.7.26) не отрисовывает
     lottie-анимации в рендере — ни через path, ни через animationData.
     Как использовать: скопировать <svg> в сцену + твины в timeline.
     Хелпер drawPath — из shared/helpers.js. Цвет линий — через
     color: на svg (класс .conn-svg берёт currentColor).
     Кастомизация: узлы = агенты/сервисы/шаги; цвета — акценты темы.
     ══════════════════════════════════════════════════════════════ -->
<html>
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../shared/dark-amber.css">
<script src="../shared/helpers.js"></script>
</head>
<body>
<div id="root" class="clip" data-composition-id="root"
     data-width="1080" data-height="1920" data-start="0" data-duration="4">

  <div id="s1" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
    <div class="scene-inner centered" style="top:180px; align-items:center;">
      <!-- ↓↓↓ копировать отсюда ↓↓↓ -->
      <svg id="net" viewBox="0 0 640 400" style="opacity:0; width:640px; height:400px; color:var(--accent-green);" class="conn-svg">
        <path id="net-p1" d="M 320 200 L 120 80"/>
        <path id="net-p2" d="M 320 200 L 520 80"/>
        <path id="net-p3" d="M 320 200 L 90 300"/>
        <path id="net-p4" d="M 320 200 L 550 300"/>
        <path id="net-p5" d="M 320 200 L 320 40"/>
        <circle id="net-n0" cx="320" cy="200" r="26" fill="#3DD68C" opacity="0" style="filter:drop-shadow(0 0 18px #3DD68C);"/>
        <circle id="net-n1" cx="120" cy="80"  r="16" fill="#5B8BFF" opacity="0" style="filter:drop-shadow(0 0 12px #5B8BFF);"/>
        <circle id="net-n2" cx="520" cy="80"  r="16" fill="#F5B544" opacity="0" style="filter:drop-shadow(0 0 12px #F5B544);"/>
        <circle id="net-n3" cx="90"  cy="300" r="16" fill="#FF6B9D" opacity="0" style="filter:drop-shadow(0 0 12px #FF6B9D);"/>
        <circle id="net-n4" cx="550" cy="300" r="16" fill="#E8742C" opacity="0" style="filter:drop-shadow(0 0 12px #E8742C);"/>
        <circle id="net-n5" cx="320" cy="40"  r="16" fill="#5B8BFF" opacity="0" style="filter:drop-shadow(0 0 12px #5B8BFF);"/>
      </svg>
      <!-- ↑↑↑ копировать досюда ↑↑↑ -->
    </div>
  </div>
</div>

<script>
(function () {
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const { fadeIn, drawPath } = createHFHelpers(tl);

  /* ↓↓↓ твины блока: линии рисуются стаггером, узлы загораются,
     центральный узел пульсирует (непрерывное движение) ↓↓↓ */
  fadeIn("#net", 0.2, 0.35);
  fadeIn("#net-n0", 0.35, 0.25);
  drawPath("#net-p1", 0.5, 0.6); fadeIn("#net-n1", 1.0, 0.2);
  drawPath("#net-p2", 0.7, 0.6); fadeIn("#net-n2", 1.2, 0.2);
  drawPath("#net-p3", 0.9, 0.6); fadeIn("#net-n3", 1.4, 0.2);
  drawPath("#net-p4", 1.1, 0.6); fadeIn("#net-n4", 1.6, 0.2);
  drawPath("#net-p5", 1.3, 0.6); fadeIn("#net-n5", 1.8, 0.2);
  tl.to("#net-n0", {attr:{r:32}, duration:0.55, yoyo:true, repeat:3, ease:"sine.inOut"}, 2.0);

  window.__timelines["root"] = tl;
})();
</script>
</body>
</html>
