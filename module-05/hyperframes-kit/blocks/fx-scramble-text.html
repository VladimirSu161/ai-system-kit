<!doctype html><html lang="ru"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1920"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root{--bg:#050505;--text:#F5F5F5;--muted:#8A8A8A;--accent-amber:#F5B544;--accent-orange:#E8742C;--accent-blue:#5B8BFF;--accent-green:#3DD68C;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);
            font-family:"Inter",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden}
  .clip{position:absolute}

  #scramble-wrap{
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:960px;
    text-align:center;
  }
  #scramble-label{
    font-size:36px;
    font-weight:400;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:24px;
  }
  #scramble-text{
    font-size:84px;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent-amber);
    line-height:1;
    white-space:nowrap;
  }
  #scramble-line{
    width:0;
    height:4px;
    background:var(--accent-amber);
    margin:32px auto 0;
    border-radius:2px;
  }
</style></head><body>
<div id="root" data-composition-id="fx-scramble" data-width="1080" data-height="1920" data-start="0" data-duration="2.5">

  <div id="scramble-wrap" class="clip"
       data-start="0" data-duration="2.5" data-track-index="0">
    <div id="scramble-label">ТЕХНОЛОГИЯ</div>
    <div id="scramble-text">НЕЙРОСЕТЬ</div>
    <div id="scramble-line"></div>
  </div>

</div>
<script>
  window.__timelines = window.__timelines || {};

  // Детерминированный ГПСЧ
  function mulberry32(s){return function(){s|=0;s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

  const FINAL   = "НЕЙРОСЕТЬ";
  const CHARSET = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯabcdefghijklmnopqrstuvwxyz0123456789#@%&";
  const LEN     = FINAL.length;

  // Заранее генерируем матрицу случайных символов 60 кадров × LEN позиций
  const FRAMES = 60;
  const randMatrix = [];
  const rng = mulberry32(42);
  for (let f = 0; f < FRAMES; f++) {
    const row = [];
    for (let i = 0; i < LEN; i++) {
      row.push(CHARSET[Math.floor(rng() * CHARSET.length)]);
    }
    randMatrix.push(row);
  }

  const el = document.getElementById("scramble-text");
  const line = document.getElementById("scramble-line");

  const proxy = { p: 0 };

  const tl = gsap.timeline({ paused: true });

  // Появление лейбла
  tl.from("#scramble-label", { opacity: 0, y: -20, duration: 0.4, ease: "power2.out" }, 0);

  // Скрамбл: p от 0 до 1 за 1.6с
  tl.to(proxy, {
    p: 1,
    duration: 1.6,
    ease: "none",
    onUpdate: function() {
      const p = proxy.p;
      // Индекс в матрице (0..FRAMES-1) на основе p
      const frameIdx = Math.min(FRAMES - 1, Math.floor(p * FRAMES));
      let result = "";
      for (let i = 0; i < LEN; i++) {
        // Буква «застывает» когда p превысил её порог
        const threshold = (i / LEN) * 0.7;
        if (p >= threshold + 0.3) {
          result += FINAL[i];
        } else {
          result += randMatrix[frameIdx][i];
        }
      }
      el.textContent = result;
    }
  }, 0.3);

  // Последний кадр — финальный текст гарантированно
  tl.call(function(){ el.textContent = FINAL; }, [], 1.9);

  // Подчёркивающая линия растёт после скрамбла
  tl.to(line, { width: 320, duration: 0.4, ease: "power3.out" }, 1.9);

  // Лёгкий glow-пульс на амбер-тексте (yoyo)
  tl.to(el, {
    textShadow: "0 0 40px rgba(245,181,68,0.8), 0 0 80px rgba(245,181,68,0.4)",
    duration: 0.3,
    ease: "power2.out",
    yoyo: true,
    repeat: 1
  }, 1.9);

  window.__timelines["fx-scramble"] = tl;
</script></body></html>
